<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divination Results Viewer - Map Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4af37;
            --secondary: #8b7355;
            --dark: #1a1410;
            --darker: #0d0a08;
            --light: #f5e6d3;
            --accent: #c9a961;
            --danger: #c53030;
            --success: #38a169;
            --shadow: rgba(0, 0, 0, 0.6);
            
            /* Card rarity colors */
            --rarity-common: #9ca3af;
            --rarity-blue: #3b82f6;
            --rarity-yellow: #eab308;
            --rarity-corrupted: #a855f7;
            
            /* Divination tier colors */
            --type-fast: #60a5fa;
            --type-basic: #34d399;
            --type-advanced: #a78bfa;
            --type-premium: #fbbf24;
            --type-supreme: #f87171;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d2416 100%);
            color: var(--light);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(to bottom, var(--darker), var(--dark));
            border-bottom: 2px solid var(--primary);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: rgba(139, 115, 85, 0.3);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            color: var(--light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--primary);
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 2px 2px 4px var(--shadow);
            letter-spacing: 2px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Main Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Upload Section */
        .upload-section {
            background: linear-gradient(to bottom, var(--dark), var(--darker));
            border: 2px dashed var(--secondary);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: var(--primary);
        }

        .upload-section.drag-over {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.1);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .upload-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .upload-subtitle {
            color: rgba(245, 230, 211, 0.7);
            margin-bottom: 1.5rem;
        }

        .upload-btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--darker);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
        }

        .upload-btn-secondary {
            background: rgba(139, 115, 85, 0.3);
            border: 1px solid var(--secondary);
            color: var(--light);
            margin-left: 1rem;
        }

        .upload-btn-secondary:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--primary);
        }

        #fileInput {
            display: none;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(42, 35, 26, 0.5);
            border-radius: 8px;
            border: 1px solid var(--secondary);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-label {
            font-size: 0.8rem;
            color: rgba(245, 230, 211, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-select,
        .control-input {
            padding: 0.5rem 1rem;
            background: rgba(42, 35, 26, 0.8);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            color: var(--light);
            font-size: 0.9rem;
            min-width: 150px;
        }

        .control-select:focus,
        .control-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 1rem;
            background: rgba(42, 35, 26, 0.5);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--secondary);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Cinzel', serif;
        }

        .stat-label {
            font-size: 0.85rem;
            color: rgba(245, 230, 211, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Expand/Collapse Controls */
        .expand-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .expand-btn {
            padding: 0.5rem 1rem;
            background: rgba(139, 115, 85, 0.3);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            color: var(--light);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .expand-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--primary);
        }

        /* Divination Section - PRIMARY GROUPING */
        .divination-section {
            background: linear-gradient(to bottom, var(--dark), var(--darker));
            border: 2px solid var(--secondary);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .divination-header {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(201, 169, 97, 0.05));
            border-bottom: 1px solid var(--secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .divination-header:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(201, 169, 97, 0.1));
        }

        .divination-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--darker);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 1rem;
            min-width: 60px;
            text-align: center;
        }

        .divination-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--light);
            flex: 1;
        }

        .divination-heroes {
            display: flex;
            gap: 0.25rem;
            margin-right: 1rem;
            font-size: 1rem;
        }

        .divination-hero-count {
            background: rgba(139, 115, 85, 0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: rgba(245, 230, 211, 0.8);
            margin-right: 1rem;
        }

        .divination-toggle {
            font-size: 1rem;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .divination-section.collapsed .divination-toggle {
            transform: rotate(-90deg);
        }

        .divination-section.collapsed .divination-content {
            display: none;
        }

        .divination-content {
            padding: 1.5rem;
        }

        /* Tier Section - SECONDARY GROUPING */
        .tier-section {
            margin-bottom: 1.5rem;
        }

        .tier-section:last-child {
            margin-bottom: 0;
        }

        .tier-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: rgba(42, 35, 26, 0.5);
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--secondary);
        }

        .tier-header.type-fast {
            border-left-color: var(--type-fast);
        }

        .tier-header.type-basic {
            border-left-color: var(--type-basic);
        }

        .tier-header.type-advanced {
            border-left-color: var(--type-advanced);
        }

        .tier-header.type-premium {
            border-left-color: var(--type-premium);
        }

        .tier-header.type-supreme {
            border-left-color: var(--type-supreme);
        }

        .tier-icon {
            font-size: 1.3rem;
        }

        .tier-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .tier-card-count {
            font-size: 0.85rem;
            color: rgba(245, 230, 211, 0.6);
            margin-left: auto;
        }

        /* Heroes Grid - DYNAMIC COLUMNS */
        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .hero-card {
            background: rgba(42, 35, 26, 0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--secondary);
        }

        .hero-card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .hero-card-icon {
            font-size: 1.1rem;
        }

        .hero-card-body {
            padding: 0.75rem;
        }

        /* Card List */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(26, 20, 16, 0.5);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .card-item.highlight {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--primary);
        }

        .card-rarity {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .card-rarity.common {
            background: var(--rarity-common);
        }

        .card-rarity.blue {
            background: var(--rarity-blue);
            box-shadow: 0 0 6px var(--rarity-blue);
        }

        .card-rarity.yellow {
            background: var(--rarity-yellow);
            box-shadow: 0 0 6px var(--rarity-yellow);
        }

        .card-rarity.corrupted {
            background: var(--rarity-corrupted);
            box-shadow: 0 0 6px var(--rarity-corrupted);
        }

        .card-name {
            flex: 1;
        }

        .card-modifier {
            font-size: 0.75rem;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            text-transform: capitalize;
        }

        .card-modifier.blue {
            background: rgba(59, 130, 246, 0.2);
            color: var(--rarity-blue);
        }

        .card-modifier.yellow {
            background: rgba(234, 179, 8, 0.2);
            color: var(--rarity-yellow);
        }

        .card-modifier.corrupted {
            background: rgba(168, 85, 247, 0.2);
            color: var(--rarity-corrupted);
        }

        .card-empty {
            color: rgba(245, 230, 211, 0.4);
            font-style: italic;
            text-align: center;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(245, 230, 211, 0.6);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            padding: 1rem;
            background: rgba(42, 35, 26, 0.5);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--secondary);
        }

        .legend-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .legend-title {
            font-size: 0.8rem;
            color: rgba(245, 230, 211, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend-items {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.85rem;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Responsive */
        @media screen and (max-width: 1200px) {
            .heroes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media screen and (max-width: 768px) {
            .header {
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
            }

            .header-right {
                margin-left: 0;
            }

            .title {
                font-size: 1.2rem;
            }

            .container {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 1.5rem;
            }

            .heroes-grid {
                grid-template-columns: 1fr;
            }

            .divination-header {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .divination-title {
                width: 100%;
                order: 10;
            }

            .legend {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <a href="index_mobile.html" class="back-btn">← Back to Map</a>
            <div class="title">🔮 DIVINATION RESULTS</div>
        </div>
        <div class="header-right">
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📜</div>
            <div class="upload-title">Upload Divination Results</div>
            <div class="upload-subtitle">Drag and drop a CSV file or click to browse</div>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                📂 Choose File
            </button>
            <button class="upload-btn upload-btn-secondary" onclick="loadSampleData()">
                📋 Load Sample Data
            </button>
            <input type="file" id="fileInput" accept=".csv" onchange="handleFileUpload(event)">
        </div>

        <!-- Controls (hidden until data loaded) -->
        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label class="control-label">Filter by Divination</label>
                <select class="control-select" id="divinationFilter" onchange="applyFilters()">
                    <option value="all">All Divinations</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label">Filter by Hero</label>
                <select class="control-select" id="heroFilter" onchange="applyFilters()">
                    <option value="all">All Heroes</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label">Filter by Tier</label>
                <select class="control-select" id="tierFilter" onchange="applyFilters()">
                    <option value="all">All Tiers</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label">Search Cards</label>
                <input type="text" class="control-input" id="searchInput" placeholder="Search cards..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Legend (hidden until data loaded) -->
        <div class="legend" id="legend" style="display: none;">
            <div class="legend-section">
                <span class="legend-title">Card Rarity:</span>
                <div class="legend-items">
                    <div class="legend-item">
                        <span class="legend-dot" style="background: var(--rarity-common);"></span>
                        Common
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: var(--rarity-blue); box-shadow: 0 0 6px var(--rarity-blue);"></span>
                        Blue
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: var(--rarity-yellow); box-shadow: 0 0 6px var(--rarity-yellow);"></span>
                        Yellow
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: var(--rarity-corrupted); box-shadow: 0 0 6px var(--rarity-corrupted);"></span>
                        Corrupted
                    </div>
                </div>
            </div>
            <div class="legend-section" id="heroLegend">
                <span class="legend-title">Heroes:</span>
                <div class="legend-items" id="heroLegendItems">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Stats Bar (hidden until data loaded) -->
        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">
                <span class="stat-value" id="statDivinations">0</span>
                <span class="stat-label">Divinations</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="statHeroes">0</span>
                <span class="stat-label">Heroes</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="statTiers">0</span>
                <span class="stat-label">Tiers</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="statCards">0</span>
                <span class="stat-label">Total Cards</span>
            </div>
        </div>

        <!-- Expand/Collapse Controls -->
        <div class="expand-controls" id="expandControls" style="display: none;">
            <button class="expand-btn" onclick="expandAll()">📂 Expand All</button>
            <button class="expand-btn" onclick="collapseAll()">📁 Collapse All</button>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer"></div>
    </div>

    <script>
        // Global state
        let divinationData = [];
        let divinationTiers = [];
        let detectedHeroes = []; // Dynamically detected from data

        // Tier display order (for sorting)
        const tierOrder = ['Fast', 'Basic', 'Advanced', 'Premium', 'Supreme'];
        
        // Tier icons
        const tierIcons = {
            'Fast': '⚡',
            'Basic': '📖',
            'Advanced': '🔮',
            'Premium': '⭐',
            'Supreme': '👑'
        };

        // Default icon for unknown tiers
        const defaultTierIcon = '📋';

        // Parse CSV file
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];

            // Parse header to get tiers
            const header = lines[0].split(',');
            const tiers = new Set();
            const tierColumns = {};

            header.forEach((col, idx) => {
                if (idx === 0) return;
                const match = col.match(/^(\w+):/);
                if (match) {
                    const tier = match[1];
                    tiers.add(tier);
                    if (!tierColumns[tier]) tierColumns[tier] = [];
                    tierColumns[tier].push(idx);
                }
            });

            // Sort tiers by predefined order, then alphabetically for unknown tiers
            const knownTiers = tierOrder.filter(t => tiers.has(t));
            const unknownTiers = Array.from(tiers).filter(t => !tierOrder.includes(t)).sort();
            divinationTiers = [...knownTiers, ...unknownTiers];

            // Parse data rows and detect heroes
            const data = [];
            const heroSet = new Set();
            
            for (let i = 1; i < lines.length; i++) {
                const row = parseCSVRow(lines[i]);
                if (!row[0]) continue;

                // Parse divination info (D1: Andrin)
                const divMatch = row[0].match(/D(\d+):\s*(\w+)/);
                if (!divMatch) continue;

                const divNum = parseInt(divMatch[1]);
                const hero = divMatch[2];
                
                heroSet.add(hero);

                const entry = {
                    divination: divNum,
                    hero: hero,
                    cards: {}
                };

                // Extract cards by tier
                for (const tier of divinationTiers) {
                    entry.cards[tier] = [];
                    if (tierColumns[tier]) {
                        for (const colIdx of tierColumns[tier]) {
                            const cardStr = row[colIdx] || '';
                            if (cardStr.trim()) {
                                entry.cards[tier].push(parseCard(cardStr));
                            }
                        }
                    }
                }

                data.push(entry);
            }

            // Store detected heroes (sorted alphabetically)
            detectedHeroes = Array.from(heroSet).sort();

            return data;
        }

        // Parse a single CSV row (handling quoted fields)
        function parseCSVRow(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Parse card string (e.g., "Plague Shot (Blue)")
        function parseCard(str) {
            const match = str.match(/^(.+?)\s*\((\w+)\)$/);
            if (match) {
                return {
                    name: match[1].trim(),
                    modifier: match[2].toLowerCase()
                };
            }
            return {
                name: str.trim(),
                modifier: 'common'
            };
        }

        // Handle file upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                divinationData = parseCSV(text);
                if (divinationData.length > 0) {
                    initializeUI();
                    renderResults();
                } else {
                    alert('No valid data found in the CSV file.');
                }
            };
            reader.readAsText(file);
        }

        // Load sample data
        function loadSampleData() {

        // Initialize UI after data loaded
        function initializeUI() {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('legend').style.display = 'flex';
            document.getElementById('statsBar').style.display = 'flex';
            document.getElementById('expandControls').style.display = 'flex';

            // Populate filters
            const divinationFilter = document.getElementById('divinationFilter');
            const heroFilter = document.getElementById('heroFilter');
            const tierFilter = document.getElementById('tierFilter');

            // Get unique divinations
            const divinations = [...new Set(divinationData.map(d => d.divination))].sort((a, b) => a - b);
            divinationFilter.innerHTML = '<option value="all">All Divinations</option>' +
                divinations.map(d => `<option value="${d}">D${d}</option>`).join('');

            // Populate hero filter with detected heroes
            heroFilter.innerHTML = '<option value="all">All Heroes</option>' +
                detectedHeroes.map(h => `<option value="${h}">${h}</option>`).join('');

            // Populate tier filter
            tierFilter.innerHTML = '<option value="all">All Tiers</option>' +
                divinationTiers.map(t => `<option value="${t}">${tierIcons[t] || defaultTierIcon} ${t}</option>`).join('');

            // Update hero legend dynamically
            const heroLegendItems = document.getElementById('heroLegendItems');
            heroLegendItems.innerHTML = detectedHeroes.map(h => 
                `<div class="legend-item">👤 ${h}</div>`
            ).join('');

            // Update stats
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const divinations = new Set();
            const heroes = new Set();
            let totalCards = 0;

            divinationData.forEach(entry => {
                divinations.add(entry.divination);
                heroes.add(entry.hero);
                Object.values(entry.cards).forEach(cards => {
                    totalCards += cards.length;
                });
            });

            document.getElementById('statDivinations').textContent = divinations.size;
            document.getElementById('statHeroes').textContent = heroes.size;
            document.getElementById('statTiers').textContent = divinationTiers.length;
            document.getElementById('statCards').textContent = totalCards;
        }

        // Apply filters
        function applyFilters() {
            renderResults();
        }

        // Render results - GROUPED BY DIVINATION
        function renderResults() {
            const divinationFilter = document.getElementById('divinationFilter').value;
            const heroFilter = document.getElementById('heroFilter').value;
            const tierFilter = document.getElementById('tierFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // Filter data
            let filteredData = divinationData;

            if (divinationFilter !== 'all') {
                filteredData = filteredData.filter(d => d.divination === parseInt(divinationFilter));
            }

            if (heroFilter !== 'all') {
                filteredData = filteredData.filter(d => d.hero === heroFilter);
            }

            // Group by divination number
            const divinationGroups = {};
            filteredData.forEach(entry => {
                if (!divinationGroups[entry.divination]) {
                    divinationGroups[entry.divination] = {};
                }
                divinationGroups[entry.divination][entry.hero] = entry;
            });

            const container = document.getElementById('resultsContainer');
            let html = '';

            // Render each divination
            const sortedDivinations = Object.keys(divinationGroups).map(Number).sort((a, b) => a - b);

            for (const divNum of sortedDivinations) {
                const heroEntries = divinationGroups[divNum];
                const heroNames = Object.keys(heroEntries).sort();
                const heroCount = heroNames.length;

                html += `
                    <div class="divination-section" id="div-${divNum}">
                        <div class="divination-header" onclick="toggleDivination(${divNum})">
                            <span class="divination-badge">D${divNum}</span>
                            <span class="divination-title">Divination ${divNum}</span>
                            <span class="divination-hero-count">${heroCount} hero${heroCount !== 1 ? 'es' : ''}</span>
                            <span class="divination-toggle">▼</span>
                        </div>
                        <div class="divination-content">
                `;

                // Get tiers to show
                const tiersToShow = tierFilter === 'all' ? divinationTiers : [tierFilter];

                // Render each tier
                for (const tier of tiersToShow) {
                    const tierIcon = tierIcons[tier] || defaultTierIcon;
                    const tierClass = `type-${tier.toLowerCase()}`;
                    
                    // Count total cards for this tier
                    let tierCardCount = 0;
                    heroNames.forEach(hero => {
                        if (heroEntries[hero]) {
                            tierCardCount += (heroEntries[hero].cards[tier] || []).length;
                        }
                    });

                    html += `
                        <div class="tier-section">
                            <div class="tier-header ${tierClass}">
                                <span class="tier-icon">${tierIcon}</span>
                                <span class="tier-name">${tier}</span>
                                <span class="tier-card-count">${tierCardCount} cards</span>
                            </div>
                            <div class="heroes-grid">
                    `;

                    // Render each hero's cards for this tier (sorted alphabetically)
                    for (const hero of heroNames) {
                        const entry = heroEntries[hero];

                        html += `
                            <div class="hero-card">
                                <div class="hero-card-header">
                                    <span class="hero-card-icon">👤</span>
                                    ${hero}
                                </div>
                                <div class="hero-card-body">
                                    <div class="card-list">
                        `;

                        if (entry && entry.cards[tier] && entry.cards[tier].length > 0) {
                            for (const card of entry.cards[tier]) {
                                const highlight = searchTerm && card.name.toLowerCase().includes(searchTerm);
                                const highlightClass = highlight ? 'highlight' : '';
                                const modifierHtml = card.modifier !== 'common' ? 
                                    `<span class="card-modifier ${card.modifier}">${card.modifier}</span>` : '';

                                html += `
                                    <div class="card-item ${highlightClass}">
                                        <span class="card-rarity ${card.modifier}"></span>
                                        <span class="card-name">${card.name}</span>
                                        ${modifierHtml}
                                    </div>
                                `;
                            }
                        } else {
                            html += `<div class="card-item card-empty">No cards</div>`;
                        }

                        html += `
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    html += `
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No results found</p></div>';
        }

        // Toggle divination section
        function toggleDivination(divNum) {
            const section = document.getElementById(`div-${divNum}`);
            section.classList.toggle('collapsed');
        }

        // Expand all sections
        function expandAll() {
            document.querySelectorAll('.divination-section').forEach(section => {
                section.classList.remove('collapsed');
            });
        }

        // Collapse all sections
        function collapseAll() {
            document.querySelectorAll('.divination-section').forEach(section => {
                section.classList.add('collapsed');
            });
        }

        // Drag and drop handling
        const uploadSection = document.getElementById('uploadSection');

        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('drag-over');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('drag-over');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
            
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.csv')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    divinationData = parseCSV(text);
                    if (divinationData.length > 0) {
                        initializeUI();
                        renderResults();
                    } else {
                        alert('No valid data found in the CSV file.');
                    }
                };
                reader.readAsText(file);
            } else {
                alert('Please drop a CSV file.');
            }
        });
    </script>
